<!--
Q3. Create an HTML page containing a student registration form with fields for Student ID,
Student Name, Age, Gender, Department, and Marks. Add a suitable Submit button.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Student Registration Form</h1>

        <form action="/add" method="POST">
            <label for="student_id">Student ID</label>
            <input type="text" id="student_id" name="student_id" required>

            <label for="name">Student Name</label>
            <input type="text" id="name" name="name" required>

            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="1" required>

            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="">Select gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label for="department">Department</label>
            <input type="text" id="department" name="department" required>

            <label for="marks">Marks</label>
            <input type="number" id="marks" name="marks" min="0" max="100" required>

            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
